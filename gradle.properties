kotlin.code.style=official

# The Kotlin/Native compiler builds its library caches inside the Gradle daemon, and Gradle's
# default 384 MB metaspace is not enough for the Apple targets — linking the test binary dies with
# `OutOfMemoryError: Metaspace` without this.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
